<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Send · OpticGrid</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="sender-layout">
    <section class="panel">
      <h1>Send</h1>
      <p>The selected file stays in this browser. It is converted into looping visual frames.</p>
      <label for="file">File</label>
      <input id="file" type="file">
      <label for="fps">Frame rate</label>
      <input id="fps" type="number" min="1" max="20" value="8">
      <div class="actions">
        <button id="start">Prepare & start</button>
        <button id="pause" class="secondary" disabled>Pause</button>
        <button id="fullscreen" class="secondary">Full screen</button>
      </div>
      <div id="status" class="status">Choose a file.</div>
      <p class="small">Current prototype: 72×72 monochrome cells, approximately 500 bytes per frame. Keep the entire square inside the phone guide.</p>
      <a href="index.html">← Home</a>
    </section>
    <section class="stage" id="stage">
      <canvas id="txCanvas" width="720" height="720"></canvas>
    </section>
  </main>
  <script src="protocol.js"></script>
  <script src="sender.js"></script>
</body>
</html>
