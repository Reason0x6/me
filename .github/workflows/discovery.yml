name: Metadata discovery

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 2'

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Collect metadata candidates
        run: npm run discover
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OPENALEX_MAILTO: ${{ vars.OPENALEX_MAILTO }}
      - name: Upload review queue
        uses: actions/upload-artifact@v4
        with:
          name: marginalia-review-queue
          path: artifacts/review-queue.json
          if-no-files-found: error
          retention-days: 30

