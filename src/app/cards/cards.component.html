<div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-2 lg:grid-cols-3 gap-6 w-full">
    <div class="bg-gray-700 p-6 rounded-lg shadow-lg hover:shadow-2xl transition-all overflow-wrap w-fit min-w-[200px]" *ngFor="let card of cards">
      <h2 class="font-semibold text-xl text-red-500 mb-4">{{ card.title }}</h2>
      <p class="text-gray-300">{{ card.description }}</p>
    </div>
  </div>
