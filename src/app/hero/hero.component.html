<style>
  html, body {
    width: 100vw;
    height: 100vh;
    margin: 0;
    padding: 0;
    background: #fff !important;
    display: flex;
    align-items: center;
    justify-content: center;
    /* overflow-x: hidden; */
    /* overflow-y: hidden; */
  }
  .ascii-art {
    width: 100%;
    min-height: 100vh;
    font-family: 'Fira Mono', 'Consolas', 'Menlo', 'Monaco', 'monospace';
    font-size: 8px;
    line-height: 12px;
    color: #222;
    background: #fff;
    white-space: pre;
    user-select: none;
    pointer-events: none;
    box-sizing: border-box;
    /* overflow-x: hidden; */
    /* overflow-y: hidden; */
    /* position and z-index removed for centering */
  }
  .soft-white-overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: rgba(255,255,255,0.6);
    pointer-events: none;
    z-index: 2;
  }
</style>

<div class="soft-white-overlay"></div>
