<div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-2 lg:grid-cols-3 gap-6 w-full"> 
    <div class="bg-gray-700 p-6 rounded-lg shadow-lg hover:shadow-2xl transition-all overflow-hidden flex flex-col justify-between" *ngFor="let card of cards">
        <div>
          <h2 class="text-2xl font-semibold text-red-500 mb-4">{{ card.title }}</h2>
          <p class="text-gray-300">{{ card.description }}</p>
        </div>
        <div class="my-5">
          <a [href]="card.link" class="py-2.5 px-5 me-2 mb-2 text-sm font-medium text-gray-900 focus:outline-none bg-white rounded-full border border-gray-200 hover:bg-gray-100 hover:text-blue-700 focus:z-10 focus:ring-4 focus:ring-gray-100 dark:focus:ring-gray-700 dark:bg-gray-800 dark:text-gray-400 dark:border-gray-600 dark:hover:text-white dark:hover:bg-gray-700">View File</a>
        </div>
        </div>
  </div>
